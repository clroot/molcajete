[package]
name = "molcajete-gateway"
description = "Web gateway: serves the molcajete client and tunnels the Guacamole protocol over WebSocket to guacd or molcajeted"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
molcajete-protocol.workspace = true
molcajete-telemetry.workspace = true
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
metrics = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.27"
