[package]
name = "molcajete-client"
description = "GPU-accelerated (WebGL2) WebAssembly client for the Apache Guacamole protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
molcajete-protocol.workspace = true
base64.workspace = true

bytemuck = "1"
console_error_panic_hook = "0.1"
png = "0.18"
js-sys = "0.3"
lyon_tessellation = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
    "AddEventListenerOptions",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BinaryType",
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "CloseEvent",
    "ColorSpaceConversion",
    "CompositionEvent",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "FocusEvent",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlTextAreaElement",
    "ImageBitmap",
    "ImageBitmapOptions",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "MessageEvent",
    "MouseEvent",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Navigator",
    "Performance",
    "PointerEvent",
    "PremultiplyAlpha",
    "ResizeObserver",
    "ResizeObserverEntry",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlFramebuffer",
    "WebGlPowerPreference",
    "WebGlProgram",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlShader",
    "WebGlSync",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "WebSocket",
    "WheelEvent",
    "Window",
    "console",
]
