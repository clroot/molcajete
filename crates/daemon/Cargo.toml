[package]
name = "molcajete-daemon"
description = "Remote desktop proxy daemon compatible with Apache Guacamole's guacd: speaks the Guacamole protocol to clients and VNC/SSH/RDP to servers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "molcajeted"
path = "src/main.rs"

[dependencies]
molcajete-protocol.workspace = true
molcajete-telemetry.workspace = true
anyhow.workspace = true
base64.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

clap = { version = "4", features = ["derive", "env"] }
des = "0.8"
flate2 = "1"
jpeg-encoder = "0.7"
metrics = "0.24"
png = "0.18"
# Encoding the images of a frame side by side.
rayon = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
# Encoder of the zstd image type (libzstd, compiled from source by zstd-sys).
zstd = "0.13"

# SSH
ab_glyph = "0.2"
alacritty_terminal = "0.26"
# ring instead of the default aws-lc-rs: same algorithms, already used by
# rustls, and no aws-lc build (which needs NASM for Windows targets).
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
# SFTP file transfer over the SSH connection
russh-sftp = "4"

# RDP
ironrdp-cliprdr = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
# Graphics pipeline ([MS-RDPEGFX]); the version ironrdp-session links.
ironrdp-egfx = "0.5"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tokio = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

# RDP audio
ironrdp-rdpsnd = "0.11"
# RDP drive redirection: a directory on this host served to the server
ironrdp-rdpdr-native = "0.9"

# Video
# Built-in H.264 encoder, enabled with `--features openh264`. OpenH264 is
# compiled from source and needs a C++ compiler (`c++`, or `CXX=...`).
openh264 = { version = "0.9", optional = true }
ironrdp-rdpdr = "0.9"
ironrdp-acceptor = "0.12"
ironrdp-rdcleanpath = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[features]
# The same library decodes the H.264 of the RDP graphics pipeline where the
# platform has no decoder of its own.
openh264 = ["dep:openh264", "ironrdp-egfx/openh264-bundled"]
