[package]
name = "molcajete-daemon"
description = "Remote desktop proxy daemon compatible with Apache Guacamole's guacd: speaks the Guacamole protocol to clients and VNC/SSH/RDP to servers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "molcajeted"
path = "src/main.rs"

[dependencies]
molcajete-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
thiserror.workspace = true
tracing.workspace = true

clap = { version = "4", features = ["derive"] }
des = "0.8"
flate2 = "1"
jpeg-encoder = "0.7"
png = "0.18"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# SSH
ab_glyph = "0.2"
alacritty_terminal = "0.26"
russh = "0.65"

# RDP
ironrdp-cliprdr = "0.9"
ironrdp-connector = "0.12"
ironrdp-core = "0.3"
ironrdp-displaycontrol = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-session = "0.13"
ironrdp-svc = "0.10"
ironrdp-tokio = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

# RDP audio
ironrdp-rdpsnd = "0.11"

# Video
# Built-in H.264 encoder, enabled with `--features openh264`. OpenH264 is
# compiled from source and needs a C++ compiler (`c++`, or `CXX=...`).
openh264 = { version = "0.9", optional = true }
