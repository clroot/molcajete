# Example gateway configuration. Copy to gateway.toml and adjust.

[server]
listen = "127.0.0.1:8080"
static_dir = "web/dist"

# Our client gets image, video and audio data as raw bytes instead of base64
# (WebSocket subprotocol molcajete-binary-v1). Set to false to keep every
# tunnel on the Guacamole text protocol.
# binary_tunnel = true

[guacd]
host = "127.0.0.1"
port = 4822

# Users and connections are stored in a database. Without a [database]
# section the gateway uses SQLite (<server.data_dir>/molcajete.db).
# [database]
# url = "postgres://molcajete:secret@127.0.0.1/molcajete"
# url = "mysql://molcajete:secret@127.0.0.1/molcajete"

# Sessions of connections with "Record sessions" on (in the web UI, or
# `attributes = { record-sessions = "true" }` below) are written here.
# [recordings]
# directory = "/var/lib/molcajete/recordings"   # default: <server.data_dir>/recordings
# max_age_days = 90                             # 0 keeps recordings forever
# max_total_size = "200 GiB"                    # the oldest go first; 0 = no limit

# Created as an administrator on startup if the username does not exist
# yet; afterwards, manage users (and passwords) in the web UI. Without any
# user, an "admin" account with a random password is created and logged.
[[users]]
username = "admin"
password = "change-me"

# Single sign-on through an OpenID Connect provider (docs/administration.md,
# "Single sign-on"; every key in docs/deployment.md, "[oidc]").
# docker/keycloak/ has a test realm for it.
# [oidc]
# issuer = "https://sso.example.com/realms/example"
# client_id = "molcajete"
# client_secret = "..."          # or client_secret_file, or MOLCAJETE_OIDC_CLIENT_SECRET
# redirect_url = "https://molcajete.example.com/api/auth/oidc/callback"
# scopes = ["profile", "email"]
# username_claim = "preferred_username"
# groups_claim = "groups"
# display_name = "Example SSO"   # "Sign in with Example SSO"
# admin_groups = ["molcajete-admins"]                # role admin
# connection_manager_groups = ["molcajete-operators"] # role connection_manager
# sync_role = true               # leaving those groups lowers the role again
# sync_groups = false            # memberships in molcajete groups follow the provider
# create_groups = false          # create groups the provider names but we lack
# group_prefix = "molcajete-"    # sync only provider groups with this prefix
# auto_create_users = true       # false: only users created here beforehand
# password_login = true          # false: hide the password form
# post_logout_redirect_url = "https://molcajete.example.com/"

# Connections below are imported once, when their id is not in the
# database yet; afterwards, edit them in the web UI.

# Targets below match docker/compose.yml (hostnames are resolved by guacd).
[[connections]]
id = "vnc"
name = "VNC test desktop"
protocol = "vnc"
[connections.parameters]
hostname = "vnc"
port = "5900"
password = "secret"

[[connections]]
id = "ssh"
name = "SSH test shell"
protocol = "ssh"
[connections.parameters]
hostname = "ssh"
port = "2222"
username = "guac"
password = "guac"
font-size = "12"

# Same desktop through the Rust daemon (cargo run -p molcajete-daemon -- -l 4823).
# molcajeted runs on the host, so it reaches VNC through the published port.
[[connections]]
id = "vnc-rs"
name = "VNC test desktop (molcajeted)"
protocol = "vnc"
guacd = { host = "127.0.0.1", port = 4823 }
[connections.parameters]
hostname = "127.0.0.1"
port = "5900"
password = "secret"

[[connections]]
id = "ssh-rs"
name = "SSH test shell (molcajeted)"
protocol = "ssh"
guacd = { host = "127.0.0.1", port = 4823 }
[connections.parameters]
hostname = "127.0.0.1"
port = "2222"
username = "guac"
password = "guac"
font-size = "12"

# RDP targets: the xrdp container from docker/compose.yml (published on
# 127.0.0.1:3390 because Windows' own RDP service may hold 3389 on the host).
[[connections]]
id = "rdp"
name = "RDP test desktop"
protocol = "rdp"
[connections.parameters]
hostname = "rdp"
port = "3389"
username = "ubuntu"
password = "ubuntu"
security = "any"
ignore-cert = "true"

[[connections]]
id = "rdp-rs"
name = "RDP test desktop (molcajeted)"
protocol = "rdp"
guacd = { host = "127.0.0.1", port = 4823 }
[connections.parameters]
hostname = "127.0.0.1"
port = "3390"
username = "ubuntu"
password = "ubuntu"
security = "any"
ignore-cert = "true"
