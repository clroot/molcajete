# Test environment: stock guacd plus VNC, SSH and RDP targets.
#   docker compose -f docker/compose.yml up -d --build
services:
  guacd:
    image: guacamole/guacd:1.6.0
    ports:
      - "127.0.0.1:4822:4822"

  vnc:
    build: ./vnc
    environment:
      VNC_PASSWORD: secret
    ports:
      - "127.0.0.1:5900:5900"

  ssh:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "true"
      USER_NAME: guac
      USER_PASSWORD: guac
    ports:
      - "127.0.0.1:2222:2222"

  # xrdp + XFCE desktop; log in as ubuntu / ubuntu. Published on 3390 because
  # 3389 is usually taken by the host's own Remote Desktop service (Windows/WSL).
  rdp:
    image: scottyhardy/docker-remote-desktop:latest
    hostname: rdp
    shm_size: "1gb"
    ports:
      - "127.0.0.1:3390:3389"
