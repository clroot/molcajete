name: New feature
description: Something molcajete cannot do yet.
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - gateway (molcajete-gateway, tunnel, API)
        - web UI (web/)
        - client (molcajete-client, wasm)
        - daemon (molcajeted)
        - protocol (molcajete-protocol)
        - telemetry
        - deploy / docker
        - docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and how Apache Guacamole handles it if it does.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be possible once this is done.
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design
      description: Optional. Configuration, API, schema or UI changes you have in mind.
    validations:
      required: false
