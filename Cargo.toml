[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/client",
    "crates/gateway",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/clroot/molcajete"
rust-version = "1.94"

[workspace.dependencies]
molcajete-protocol = { path = "crates/protocol" }

anyhow = "1"
base64 = "0.22"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Dedicated profile that keeps the wasm bundle small
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
