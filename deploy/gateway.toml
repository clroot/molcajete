# Gateway configuration for the container deployment (deploy/compose.yml,
# deploy/k8s). It holds passwords: keep the real file out of git (mount it,
# or store it as a Kubernetes Secret / SealedSecret).
#
# `server.listen` and `server.static_dir` are set by the image
# (MOLCAJETE_LISTEN, MOLCAJETE_STATIC_DIR) and need not be repeated here.

# molcajeted runs next to the gateway: a separate compose service, or a
# second container in the same Kubernetes pod (then use host = "127.0.0.1").
[guacd]
host = "molcajeted"
port = 4822

# Users and connections are kept in a database: PostgreSQL or MySQL here,
# otherwise SQLite in MOLCAJETE_DATA_DIR (/var/lib/molcajete; mount a volume).
# [database]
# url = "postgres://molcajete:change-me@postgres/molcajete"

# Connection passwords and keys are encrypted in the database with this key
# (`openssl rand -base64 32`); keep a copy with the database backups. Without
# one, the gateway generates MOLCAJETE_DATA_DIR/secret.key, which needs a
# volume there to survive. MOLCAJETE_SECRET_KEY wins over the file.
# [secrets]
# key = "..."

# Created as an administrator on first start; afterwards manage users and
# connections in the web UI. The entries below are only imported once.
[[users]]
username = "admin"
password = "change-me"

[[connections]]
id = "desktop"
name = "Desktop (VNC)"
protocol = "vnc"
[connections.parameters]
hostname = "192.168.0.10"
port = "5900"
password = "change-me"

