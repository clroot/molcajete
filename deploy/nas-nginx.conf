# Public entry point on the NAS reverse proxy (same layout as the zot
# registry): browser -> https://molcajete.example.com -> NAS nginx ->
# Tailnet-only ingress (deploy/k8s/ingress.yaml) -> gateway.
#
# Replace molcajete.example.com, the Tailnet IP and the Tailnet hostname.
# Authentication is done by the gateway ([[users]] in gateway.toml); the
# Authorization header is passed through unchanged.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=molcajete_http:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=molcajete_connections:10m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name molcajete.example.com;

    ssl_certificate /usr/local/certificate/fullchain.pem;
    ssl_certificate_key /usr/local/certificate/privkey.pem;

    client_max_body_size 1m;
    limit_conn molcajete_connections 20;

    location / {
        limit_req zone=molcajete_http burst=40 nodelay;
        include /etc/nginx/conf.d/molcajete.upstream.inc;
    }

    # Remote desktop sessions: long-lived WebSocket, latency-sensitive.
    location = /websocket-tunnel {
        include /etc/nginx/conf.d/molcajete.upstream.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        # The client pings every few seconds; this only ends dead tunnels.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}
